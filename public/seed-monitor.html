<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quran API — Seed Monitor</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1c2430;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --green: #3fb950;
        --yellow: #d29922;
        --red: #f85149;
        --track: #21262d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
      header h1 { font-size: 22px; margin: 0 0 4px; }
      header p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
      .conn { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
      .conn.on { color: var(--green); border-color: var(--green); }
      .conn.off { color: var(--red); border-color: var(--red); }
      .toolbar {
        display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px; padding: 12px; margin-bottom: 16px;
      }
      input[type="password"], input[type="text"] {
        background: var(--panel-2); border: 1px solid var(--border);
        color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 14px;
        flex: 1 1 220px; min-width: 160px;
      }
      button {
        background: var(--accent); color: #fff; border: none; border-radius: 8px;
        padding: 8px 14px; font-size: 14px; cursor: pointer; font-weight: 600;
      }
      button.ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .jobs { display: grid; gap: 12px; }
      .job {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px; padding: 14px 16px;
      }
      .job-head { display: flex; justify-content: space-between; align-items: baseline; }
      .job-title { font-weight: 600; font-size: 15px; }
      .job-pct { font-variant-numeric: tabular-nums; font-weight: 700; }
      .bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 8px 0; }
      .bar > span { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .3s ease; }
      .job.done .bar > span { background: var(--green); }
      .job.error .bar > span { background: var(--red); }
      .job-meta { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .job .start { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; font-size: 12px; }
      .logs {
        margin-top: 20px; background: #010409; border: 1px solid var(--border);
        border-radius: 10px; padding: 12px; height: 240px; overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
      }
      .logs div { white-space: pre-wrap; }
      .log-info { color: var(--muted); }
      .log-success { color: var(--green); }
      .log-warn { color: var(--yellow); }
      .log-error { color: var(--red); }
      .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
      .badge.running { color: var(--accent); border-color: var(--accent); }
      .badge.done { color: var(--green); border-color: var(--green); }
      .badge.error { color: var(--red); border-color: var(--red); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h1>🕌 Quran API — Seed Monitor</h1>
          <span id="conn" class="conn off">● disconnected</span>
        </div>
        <p>Realtime monitoring proses seeding data dari equran.id</p>
      </header>

      <div class="toolbar">
        <input id="adminKey" type="password" placeholder="Seed Admin Key (x-seed-admin-key)" />
        <button id="btnStart">Start Full Seed</button>
        <button id="btnStatus" class="ghost">Check Status</button>
      </div>

      <div class="jobs" id="jobs"></div>

      <div class="logs" id="logs"></div>
    </div>

    <!-- socket.io client is served by the API itself -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const API_PREFIX = '/api/v1';
      const JOBS = [
        { key: 'surah', label: '📖 Surat Data' },
        { key: 'ayat', label: '📝 Ayat Data' },
        { key: 'tafsir', label: '📚 Tafsir' },
        { key: 'doa', label: '🤲 Doa & Dzikir' },
      ];

      const jobsEl = document.getElementById('jobs');
      const logsEl = document.getElementById('logs');
      const connEl = document.getElementById('conn');
      const adminKeyEl = document.getElementById('adminKey');

      adminKeyEl.value = localStorage.getItem('seedAdminKey') || '';
      adminKeyEl.addEventListener('change', () =>
        localStorage.setItem('seedAdminKey', adminKeyEl.value),
      );

      // Render job cards
      const cards = {};
      for (const job of JOBS) {
        const el = document.createElement('div');
        el.className = 'job';
        el.id = 'job-' + job.key;
        el.innerHTML = `
          <div class="job-head">
            <span class="job-title">${job.label}
              <span class="badge" data-badge>pending</span>
            </span>
            <span class="job-pct" data-pct>0%</span>
          </div>
          <div class="bar"><span data-bar></span></div>
          <div class="job-meta">
            <span data-current>Status: Menunggu</span>
            <span data-eta></span>
          </div>
          <div style="margin-top:8px"><button class="start" data-start>Seed ${job.key}</button></div>
        `;
        jobsEl.appendChild(el);
        cards[job.key] = el;
        el.querySelector('[data-start]').addEventListener('click', () =>
          startJob(job.key),
        );
      }

      function headers() {
        return {
          'Content-Type': 'application/json',
          'x-seed-admin-key': adminKeyEl.value.trim(),
        };
      }

      function log(level, message) {
        const d = document.createElement('div');
        d.className = 'log-' + level;
        const t = new Date().toLocaleTimeString('id-ID', { hour12: false });
        const icon =
          level === 'success' ? '✅' : level === 'warn' ? '⚠️' : level === 'error' ? '❌' : 'ℹ️';
        d.textContent = `${t} ${icon} ${message}`;
        logsEl.appendChild(d);
        logsEl.scrollTop = logsEl.scrollHeight;
        while (logsEl.children.length > 300) logsEl.removeChild(logsEl.firstChild);
      }

      function setBadge(el, status) {
        const b = el.querySelector('[data-badge]');
        b.textContent = status;
        b.className = 'badge ' + status;
        el.classList.remove('done', 'error');
        if (status === 'done') el.classList.add('done');
        if (status === 'error') el.classList.add('error');
      }

      function renderProgress(d) {
        const el = cards[d.job];
        if (!el) return;
        const pct = Math.max(0, Math.min(100, d.percent || 0));
        el.querySelector('[data-bar]').style.width = pct + '%';
        el.querySelector('[data-pct]').textContent = pct.toFixed(0) + '%';
        el.querySelector('[data-current]').textContent =
          `Sedang: ${d.currentItem || '-'} (${d.current}/${d.total})`;
        setBadge(el, d.status || 'running');
        if (d.estimatedDone) {
          const secs = Math.max(0, Math.round((new Date(d.estimatedDone) - Date.now()) / 1000));
          el.querySelector('[data-eta]').textContent =
            secs > 0 ? `Estimasi: ~${Math.ceil(secs / 60)} menit` : '';
        }
      }

      function renderStatus(list) {
        for (const s of list) {
          const el = cards[s.jobName];
          if (!el) continue;
          const total = s.totalItems || 0;
          const done = s.doneItems || 0;
          const pct = total > 0 ? (done / total) * 100 : s.status === 'done' ? 100 : 0;
          el.querySelector('[data-bar]').style.width = pct + '%';
          el.querySelector('[data-pct]').textContent = pct.toFixed(0) + '%';
          el.querySelector('[data-current]').textContent =
            s.status === 'pending'
              ? 'Status: Menunggu'
              : `${done}/${total} item`;
          setBadge(el, s.status);
          if (s.errorMsg) log('error', `${s.jobName}: ${s.errorMsg}`);
        }
      }

      async function startSeed() {
        try {
          const res = await fetch(`${API_PREFIX}/seed/start`, {
            method: 'POST',
            headers: headers(),
          });
          const body = await res.json();
          log(res.ok ? 'info' : 'error', body.message || JSON.stringify(body));
        } catch (e) {
          log('error', 'Gagal memulai seeding: ' + e.message);
        }
      }

      async function startJob(job) {
        try {
          const res = await fetch(`${API_PREFIX}/seed/start/${job}`, {
            method: 'POST',
            headers: headers(),
          });
          const body = await res.json();
          log(res.ok ? 'info' : 'error', body.message || JSON.stringify(body));
        } catch (e) {
          log('error', `Gagal memulai job ${job}: ` + e.message);
        }
      }

      async function checkStatus() {
        try {
          const res = await fetch(`${API_PREFIX}/seed/status`, {
            headers: headers(),
          });
          const body = await res.json();
          if (body.success && Array.isArray(body.data)) renderStatus(body.data);
          else log('error', body.message || 'Gagal mengambil status');
        } catch (e) {
          log('error', 'Gagal mengambil status: ' + e.message);
        }
      }

      document.getElementById('btnStart').addEventListener('click', startSeed);
      document.getElementById('btnStatus').addEventListener('click', checkStatus);

      // WebSocket realtime
      let pollTimer = null;
      function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(checkStatus, 2000);
      }
      function stopPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = null;
      }

      try {
        const socket = io('/seed-progress', { transports: ['websocket', 'polling'] });
        socket.on('connect', () => {
          connEl.textContent = '● connected';
          connEl.className = 'conn on';
          stopPolling();
          checkStatus();
        });
        socket.on('disconnect', () => {
          connEl.textContent = '● disconnected';
          connEl.className = 'conn off';
          startPolling();
        });
        socket.on('seed:progress', renderProgress);
        socket.on('seed:done', (d) => {
          const el = cards[d.job];
          if (el) {
            el.querySelector('[data-bar]').style.width = '100%';
            el.querySelector('[data-pct]').textContent = '100%';
            el.querySelector('[data-current]').textContent =
              `Selesai: ${d.totalItems} item (${d.duration})`;
            setBadge(el, 'done');
          }
          log('success', `Job ${d.job} selesai — ${d.totalItems} item (${d.duration})`);
        });
        socket.on('seed:error', (d) => {
          log('error', `[${d.job}] ${d.failedItem}: ${d.error}`);
        });
        socket.on('seed:log', (d) => log(d.level, d.message));
      } catch (e) {
        log('warn', 'WebSocket tidak tersedia, fallback ke polling');
        startPolling();
      }

      // Initial load
      checkStatus();
    </script>
  </body>
</html>
